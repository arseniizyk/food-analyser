services:
    postgres:
        image: postgres:18-alpine
        container_name: food_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - '${POSTGRES_PORT}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - internal

    ml:
        build:
            context: ./ml
            dockerfile: Dockerfile
        container_name: food_ml
        restart: unless-stopped
        env_file: .env
        environment:
            ML_PORT: ${ML_PORT}
            OCR_DEVICE: gpu:0
        shm_size: '4gb'
        volumes:
            - ml_models:/root/.paddlex
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: 1
                          capabilities: [gpu]
        ports:
            - '${ML_PORT}:${ML_PORT}'
        healthcheck:
            test:
              [
                  "CMD",
                  "python",
                  "-c",
                  "import urllib.request; urllib.request.urlopen('http://localhost:${ML_PORT}/health')",
              ]
            interval: 30s
            timeout: 20s
            retries: 5
            start_period: 60s
        networks:
            - internal

    migrate:
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: migrate
        container_name: food_migrate
        restart: on-failure:5
        env_file: .env
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - internal

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
            target: app
        container_name: food_backend
        restart: unless-stopped
        env_file: .env
        environment:
            HTTP_PORT: ${HTTP_PORT}
        ports:
            - '${HTTP_PORT}:${HTTP_PORT}'
        healthcheck:
            test: ["CMD", "/healthcheck"]
            interval: 10s
            timeout: 3s
            retries: 3
            start_period: 5s
        depends_on:
            postgres:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
            ml:
                condition: service_healthy
        networks:
            - internal

networks:
    internal:

volumes:
    postgres_data:
    ml_models: