version: "3"

vars:
  GO_VERSION: "1.26"

  GOLANGCI_LINT_VERSION: "v2.9.0"
  GCI_VERSION: "v0.14.0"
  GOFUMPT_VERSION: "v0.9.2"
  OAPI_CODEGEN_VERSION: "v2.7.1"

  BIN_DIR: "{{.ROOT_DIR}}/bin"

  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint"
  GCI: "{{.BIN_DIR}}/gci"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt"
  OAPI_CODEGEN: "{{.BIN_DIR}}/oapi-codegen"

  NODE_MODULES_DIR: "{{.ROOT_DIR}}/node_modules/.bin"
  REDOCLY: "{{.NODE_MODULES_DIR}}/redocly"

  OPEN_API_BACKEND_V1_BASE: "{{.ROOT_DIR}}/api/backend/v1/backend.openapi.yaml"
  OPEN_API_BACKEND_V1_BUNDLE: "{{.ROOT_DIR}}/api/bundles/backend.openapi.v1.bundle.yaml"

tasks:
  install-formatters:
    desc: "Устанавливает gofumpt и gci"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}

        [ -x {{.GOFUMPT}} ] || {
          echo "📦 Installing gofumpt {{.GOFUMPT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }

        [ -x {{.GCI}} ] || {
          echo "📦 Installing gci {{.GCI_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирование Go-кода"
    deps:
      - install-formatters
    cmds:
      - |
        echo "🧼 Running gofumpt..."
        find . -type f -name '*.go' \
          ! -path './vendor/*' \
          ! -path '*/mocks/*' \
          -exec {{.GOFUMPT}} -extra -w {} +

      - |
        echo "🎯 Running gci..."
        {{.GCI}} write \
          -s standard \
          -s default \
          -s "prefix(github.com/arseniizyk/food-analyser)" \
          .

  install-golangci-lint:
    desc: "Устанавливает golangci-lint"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}

        [ -x {{.GOLANGCI_LINT}} ] || {
          echo "📦 Installing golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запуск golangci-lint"
    deps:
      - install-golangci-lint
    cmds:
      - '{{.GOLANGCI_LINT}} run --config=.golangci.yml'

  redocly-cli:install:
    desc: "Установить Redocly CLI"
    cmds:
      - |
        [ -x {{.REDOCLY}} ] || {
          npm ci
        }

  redocly-cli:bundle:
    desc: "Собрать OpenAPI bundle"
    deps:
      - redocly-cli:install
    cmds:
      - '{{.REDOCLY}} bundle {{.OPEN_API_BACKEND_V1_BASE}} -o {{.OPEN_API_BACKEND_V1_BUNDLE}}'

  oapi-codegen:install:
    desc: "Установить oapi-codegen"
    cmds:
      - |
        mkdir -p {{.BIN_DIR}}

        [ -x {{.OAPI_CODEGEN}} ] || {
          echo "📦 Installing oapi-codegen {{.OAPI_CODEGEN_VERSION}}..."
          GOBIN={{.BIN_DIR}} go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@{{.OAPI_CODEGEN_VERSION}}
        }
    status:
      - test -x {{.OAPI_CODEGEN}}

  gen:
    desc: "Сгенерировать Go-код из OpenAPI"
    deps:
      - oapi-codegen:install
    cmds:
      - '{{.OAPI_CODEGEN}} --config=./api/backend/v1/config.yaml ./api/backend/v1/backend.openapi.yaml'

  deps:update:
    desc: "Обновить зависимости"
    cmds:
      - go mod tidy