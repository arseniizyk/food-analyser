type: array
items:
  type: object
  description: Barcode
  required:
    - barcode
    - created_at
    - score
  properties:
    barcode:
      type: string
      example: "4601234567890"
    created_at:
      type: string
      format: date-time
      example: "2026-08-15T20:50:00Z"
    score:
      type: integer
      example: 78
