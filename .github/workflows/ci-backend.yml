name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Check formatting (gofumpt)
        run: |
          go install mvdan.cc/gofumpt@v0.9.2
          DIFF=$(gofumpt -extra -l ./...)
          if [ -n "$DIFF" ]; then
            echo "::error::Files not formatted with gofumpt:"
            echo "$DIFF"
            echo ""
            echo "Run: gofumpt -extra -w ."
            exit 1
          fi

      - name: Check import ordering (gci)
        run: |
          go install github.com/daixiang0/gci@v0.14.0
          DIFF=$(gci write -s standard -s default -s "prefix(github.com/arseniizyk/food-analyser/backend)" --dry-run -l ./...)
          if [ -n "$DIFF" ]; then
            echo "::error::Imports not ordered with gci:"
            echo "$DIFF"
            echo ""
            echo "Run: gci write -s standard -s default -s \"prefix(github.com/arseniizyk/food-analyser/backend)\" ."
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0
          working-directory: backend
          args: --config=.golangci.yml

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build
        run: go build ./...
        working-directory: backend

      - name: Test
        run: go test -race -count=1 ./...
        working-directory: backend

  openapi-codegen:
    name: OpenAPI Codegen Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Install oapi-codegen
        run: go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.1

      - name: Generate code
        run: oapi-codegen --config=./api/backend/v1/config.yaml ./api/backend/v1/backend.openapi.yaml
        working-directory: backend

      - name: Check for uncommitted generated code
        run: |
          if ! git diff --exit-code backend/pkg/; then
            echo "::error::Generated OpenAPI code is out of date. Run 'task backend:gen' and commit the changes."
            exit 1
          fi
